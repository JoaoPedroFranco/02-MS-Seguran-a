global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ms-av-02-login
    metrics_path: /actuator/prometheus
    static_configs:
      # "app" = container do docker-compose
      # "host.docker.internal" = aplicacao rodando direto na IDE / mvn spring-boot:run
      - targets: ['app:8080', 'host.docker.internal:8080']
