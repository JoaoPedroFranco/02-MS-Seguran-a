spring:
  application:
    name: ms-av-02-login
  datasource:
    url: jdbc:h2:mem:logindb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always   # executa schema.sql e data.sql na subida

# Usuarios de seguranca (tabelas users/authorities do JdbcUserDetailsManager)
app:
  seguranca:
    admin:
      username: admin
      senha: admin123
    manutencao:
      username: manutencao
      senha: manut123
  login:
    # "Caso o usuario falhe MAIS DE UMA VEZ no login ele deve ser bloqueado"
    max-falhas-permitidas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
